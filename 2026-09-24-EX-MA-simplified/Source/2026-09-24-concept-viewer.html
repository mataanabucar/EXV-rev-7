<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EX-MA Concept Views</title>
<style>
  :root { --ink:#1b2430; --muted:#5b6673; --bg:#eef2f6; }
  html,body { margin:0; background:var(--bg); font-family: "Segoe UI", Helvetica, Arial, sans-serif; color:var(--ink); }
  #wrap { position:relative; width:1800px; height:1150px; overflow:hidden; background:linear-gradient(#f7f9fb,#e3e9ef); }
  #bar { position:absolute; left:0; top:0; right:0; height:64px; background:#1b2a3d; color:#fff; display:flex; align-items:center; padding:0 28px; gap:18px; z-index:3; }
  #bar .tag { background:#f08a24; color:#1b1b1b; font-weight:700; font-size:15px; padding:5px 10px; border-radius:4px; letter-spacing:.04em; }
  #bar .t { font-size:23px; font-weight:600; }
  #c { position:absolute; left:0; top:64px; }
  svg { position:absolute; left:0; top:64px; pointer-events:none; z-index:2; }
  #legend { position:absolute; right:22px; top:82px; background:rgba(255,255,255,.92); border:1px solid #c9d2dc; border-radius:8px; padding:12px 16px; font-size:15px; z-index:3; }
  #legend div { display:flex; align-items:center; gap:10px; margin:5px 0; }
  #legend i { display:inline-block; width:30px; height:7px; border-radius:4px; }
  #foot { position:absolute; left:22px; bottom:14px; font-size:14px; color:var(--muted); z-index:3; background:rgba(255,255,255,.85); padding:6px 10px; border-radius:6px; }
</style>
<script type="importmap">{ "imports": { "three": "./three.module.js" } }</script>
<script src="./data.js"></script>
</head>
<body>
<div id="wrap">
  <div id="bar"><span class="tag">CONCEPT — BEFORE CAD</span><span class="t" id="title"></span></div>
  <canvas id="c" width="1800" height="1086"></canvas>
  <svg id="ov" width="1800" height="1086"></svg>
  <div id="legend"></div>
  <div id="foot">Exterior = real EX-MA mesh at design scale (×1.408). Mechanism, box, conduit and cables are placeholder geometry from the planned layout, not CAD. Cables drawn at 2× diameter for visibility.</div>
</div>
<script type="module">
import * as THREE from 'three';

const W = 1800, H = 1086;
const params = new URLSearchParams(location.search);
const viewKey = params.get('view') || '01-full-assembly';
const V = SCENE.views[viewKey];
document.getElementById('title').textContent = V.title;

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.localClippingEnabled = true;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.setClearColor(0xeef2f6, 1);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0x7d858f, 1.25));
const sun = new THREE.DirectionalLight(0xffffff, 1.9); sun.position.set(-600, 900, -700); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.7); fill.position.set(700, 300, 800); scene.add(fill);

const cutPlane = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0.0);  // keeps the far (+v) half; camera looks from -v
const xPlane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), V.clipx ?? 0);  // optional: keeps u <= clipx

function visible(group) {
  if (V.only) return V.only.includes(group);
  return !(V.hide || []).includes(group);
}
function mat(color, group, opts = {}) {
  const ghost = (V.ghost || {})[group];
  const opacity = ghost !== undefined ? ghost : (opts.opacity ?? 1);
  const m = new THREE.MeshStandardMaterial({
    color, roughness: 0.62, metalness: opts.metal ? 0.55 : 0.08,
    side: THREE.DoubleSide, flatShading: !!opts.flat,
    transparent: opacity < 1, opacity, depthWrite: opacity >= 0.99,
  });
  if (opts.clip && (V.cut || []).includes(group)) m.clippingPlanes = [cutPlane];
  if (V.clipx !== undefined) m.clippingPlanes = (m.clippingPlanes || []).concat([xPlane]);
  return m;
}

// EX-MA exterior meshes
for (const M of MESHES) {
  if (!visible(M.group)) continue;
  const bytes = Uint8Array.from(atob(M.b64), c => c.charCodeAt(0));
  const pos = new Float32Array(bytes.buffer);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, mat(M.color, M.group, { flat: true, clip: M.clip, metal: M.color === '#9aa3ab' })));
}

class Poly extends THREE.Curve {
  constructor(pts) {
    super(); this.p = pts.map(a => new THREE.Vector3(...a)); this.cum = [0];
    for (let i = 1; i < this.p.length; i++) this.cum.push(this.cum[i - 1] + this.p[i].distanceTo(this.p[i - 1]));
  }
  getPoint(t, out = new THREE.Vector3()) {
    const L = t * this.cum[this.cum.length - 1];
    let i = 1; while (i < this.cum.length - 1 && this.cum[i] < L) i++;
    const s = (L - this.cum[i - 1]) / Math.max(1e-9, this.cum[i] - this.cum[i - 1]);
    return out.copy(this.p[i - 1]).lerp(this.p[i], Math.min(1, Math.max(0, s)));
  }
}
function tube(pts, r, material) {
  const c = new Poly(pts);
  return new THREE.Mesh(new THREE.TubeGeometry(c, Math.max(64, pts.length * 6), r, 10, false), material);
}

// proxies
for (const P of SCENE.proxies) {
  if (!visible(P.group)) continue;
  const m = mat(P.color, P.group, { opacity: P.opacity, clip: true, metal: P.color === '#9aa3ab' || P.color === '#b87333' });
  let mesh;
  if (P.type === 'box') {
    const a = new THREE.Vector3(...P.min), b = new THREE.Vector3(...P.max);
    const size = b.clone().sub(a), ctr = a.clone().add(b).multiplyScalar(0.5);
    mesh = new THREE.Mesh(new THREE.BoxGeometry(Math.abs(size.x), Math.abs(size.y), Math.abs(size.z)), m);
    mesh.position.copy(ctr);
  } else if (P.type === 'cyl') {
    const a = new THREE.Vector3(...P.a), b = new THREE.Vector3(...P.b);
    const len = a.distanceTo(b);
    mesh = new THREE.Mesh(new THREE.CylinderGeometry(P.r, P.r, len, P.seg || 40), m);
    mesh.position.copy(a.clone().add(b).multiplyScalar(0.5));
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b.clone().sub(a).normalize());
  } else if (P.type === 'sph') {
    mesh = new THREE.Mesh(new THREE.SphereGeometry(P.r, 32, 16), m); mesh.position.set(...P.c);
  } else if (P.type === 'torus') {
    mesh = new THREE.Mesh(new THREE.TorusGeometry(P.R, P.r, 16, 96), m);
    mesh.position.set(...P.c); mesh.rotation.x = Math.PI / 2;
  } else if (P.type === 'ring') {
    const prof = [[P.r_in, P.y0], [P.r_out, P.y0], [P.r_out, P.y1], [P.r_in, P.y1], [P.r_in, P.y0]]
      .map(([r, y]) => new THREE.Vector2(r, y));
    mesh = new THREE.Mesh(new THREE.LatheGeometry(prof, 128), m);
  } else if (P.type === 'path') {
    mesh = tube(P.pts, P.r, m);
  }
  scene.add(mesh);
}

// cables
if (visible('cables')) {
  for (const S of SCENE.strands) {
    const m = new THREE.MeshStandardMaterial({ color: S.color, roughness: 0.45, metalness: 0.2, emissive: S.color, emissiveIntensity: 0.18 });
    if (V.clipx !== undefined) m.clippingPlanes = [xPlane];
    scene.add(tube(S.pts, SCENE.cable_r, m));
  }
}

const cam = new THREE.PerspectiveCamera(V.cam.fov, W / H, 5, 8000);
cam.position.set(...V.cam.pos); cam.lookAt(new THREE.Vector3(...V.cam.target));
renderer.render(scene, cam);

// labels
const svg = document.getElementById('ov'); const NS = 'http://www.w3.org/2000/svg';
for (const L of V.labels) {
  const p = new THREE.Vector3(...L.at).project(cam);
  const x = (p.x + 1) / 2 * W, y = (1 - p.y) / 2 * H;
  const tx = x + L.dx, ty = y + L.dy;
  const line = document.createElementNS(NS, 'line');
  Object.entries({ x1: x, y1: y, x2: tx, y2: ty, stroke: '#1b2a3d', 'stroke-width': 1.6 }).forEach(([k, v]) => line.setAttribute(k, v));
  svg.appendChild(line);
  const dot = document.createElementNS(NS, 'circle');
  Object.entries({ cx: x, cy: y, r: 3.5, fill: '#1b2a3d' }).forEach(([k, v]) => dot.setAttribute(k, v));
  svg.appendChild(dot);
  const t = document.createElementNS(NS, 'text');
  t.textContent = L.text;
  Object.entries({ x: tx, y: ty, 'font-size': 17, 'font-weight': 600, fill: '#1b2430',
    'text-anchor': L.dx < 0 ? 'end' : 'start', 'dominant-baseline': 'middle' }).forEach(([k, v]) => t.setAttribute(k, v));
  svg.appendChild(t);
  const bb = t.getBBox();
  const r = document.createElementNS(NS, 'rect');
  Object.entries({ x: bb.x - 6, y: bb.y - 3, width: bb.width + 12, height: bb.height + 6, rx: 4, fill: 'rgba(255,255,255,0.9)', stroke: '#9fb0c2' })
    .forEach(([k, v]) => r.setAttribute(k, v));
  svg.insertBefore(r, t);
}
const lg = document.getElementById('legend');
for (const [name, c] of SCENE.legend) lg.insertAdjacentHTML('beforeend', `<div><i style="background:${c}"></i>${name}</div>`);
window.READY = true;
</script>
</body>
</html>
